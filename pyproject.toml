[project]
name = "nonebot-plugin-bili-fans-overlap"
version = "0.1.0"
description = "查询 B 站粉丝团 UID 重合率的 NoneBot 插件"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx[http2,brotli,zstd]>=0.28.1",
    "nonebot-adapter-onebot>=2.4.6",
    "nonebot2>=2.4.0",
    "pydantic>=2.7.0",
    "typing-extensions>=4.12.0",
]

[dependency-groups]
dev = [
    "basedpyright>=1.31.0",
    "fastapi>=0.115.0",
    "nonebug>=0.4.3",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.12.0",
    "uvicorn>=0.35.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nonebot_plugin_bili_fans_overlap"]

[tool.basedpyright]
typeCheckingMode = "all"
pythonVersion = "3.11"
pythonPlatform = "All"
include = ["nonebot_plugin_bili_fans_overlap", "tests"]
exclude = ["**/__pycache__", "**/.venv", "**/build", "**/dist"]
reportUnusedCallResult = "warning"
reportUnnecessaryTypeIgnoreComment = "error"
reportUnusedVariable = "error"
reportMissingParameterType = "error"
reportPrivateUsage = "error"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["nonebot_plugin_bili_fans_overlap", "tests"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",
    "CPY001",
    "D203",
    "D213",
    "FBT001",
    "FBT002",
    "FIX002",
    "ISC001",
    "RUF001",
    "TD002",
    "TD003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ARG", "D", "PLR2004", "S101", "SLF001"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
addopts = ["-ra", "--strict-config", "--strict-markers"]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["error"]
